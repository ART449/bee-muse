plugins { id 'com.android.application' }
android {
    namespace 'com.iartlabs.beemuse'
    compileSdk 35
    defaultConfig { applicationId 'com.iartlabs.beemuse'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.4.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('copyCompanions', Copy) {
    from '../../service/mascotas/cyberbee-octohype'
    into 'src/main/assets/companion'
    include '*.gif', '*.png'
}
tasks.named('preBuild').configure { dependsOn 'copyCompanions' }
