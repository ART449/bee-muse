name: Build and test Bee-Muse
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -r requirements-build.txt -r requirements-mcp.txt -r requirements-voice.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_desktop.py
      - run: npm ci
        working-directory: desktop
      - run: npm run package
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Bee-Muse-${{ runner.os }}-${{ runner.arch }}
          path: desktop/ready/
          if-no-files-found: error
