name: Build and test Bee-Muse
on:
  workflow_dispatch:
  push:
    branches: ['main', 'feat/ports-**']
    paths:
      - 'service/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            python: '3.14'
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            python: '3.14'
          - name: windows-x64
            runner: windows-latest
            python: '3.14'
          - name: windows-arm64
            runner: windows-11-arm
            python: '3.14'
          - name: macos-arm64
            runner: macos-latest
            python: '3.14'
          - name: macos-x64
            runner: macos-15-intel
            python: '3.14'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -r requirements-build.txt -r requirements-mcp.txt -r requirements-voice.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_desktop.py
      - name: Smoke test packaged backend
        run: python scripts/smoke_backend.py
      - run: npm ci
        working-directory: desktop
      - run: npm run package
        working-directory: desktop
      - run: python scripts/archive_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Bee-Muse-${{ matrix.name }}
          path: desktop/release/
          compression-level: 0
          if-no-files-found: error
